name: herewego

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    networks:
      - herewego-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend_dev
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    environment:
      - MODEL_URL=http://model:8000
    command: uvicorn main:app --host 0.0.0.0 --port 4000 --reload
    depends_on:
      - model
    networks:
      - herewego-net

  model:
    build:
      context: ./model
      dockerfile: Dockerfile.dev
    container_name: model_dev
    volumes:
      - ./model:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - herewego-net

networks:
  herewego-net:
    external: true
