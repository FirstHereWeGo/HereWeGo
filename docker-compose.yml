name: herewego

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: frontend_prod
    ports:
      - "5173:80"
    networks:
      - herewego-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_prod
    ports:
      - "4000:4000"
    environment:
      - MODEL_URL=http://model:8000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    depends_on:
      - model
    networks:
      - herewego-net

  model:
    build:
      context: ./model
      dockerfile: Dockerfile
    container_name: model_prod
    ports:
      - "8000:8000"
    networks:
      - herewego-net

networks:
  herewego-net:
    external: true
